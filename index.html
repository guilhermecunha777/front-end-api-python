
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minecraft Server Dashboard</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <aside class="sidebar">

        <h2>Minecraft<span>Panel</span></h2>

        <nav>
            <button class="nav-item active">Dashboard</button>
            <button class="nav-item">Console</button>
            <button class="nav-item">Whitelist Java</button>
            <button class="nav-item">Whitelist Bedrock</button>
            <button class="nav-item">Usuários</button>
        </nav>

        <button id="logoutButton" class="logout">
            Sair
        </button>

    </aside>

    <main class="main">

        <header>
            <div>
                <h1>Dashboard</h1>
                <p>Gerenciamento do servidor Minecraft</p>
            </div>

            <div id="wsStatus" class="status disconnected">
                WebSocket desconectado
            </div>
        </header>

        <section class="server-card">

            <div>
                <h2>Servidor Minecraft</h2>

                <p>
                    Status:
                    <strong id="serverStatus">Desconhecido</strong>
                </p>
            </div>

            <div class="actions">

                <button id="startButton" class="success">
                    Start
                </button>

                <button id="stopButton" class="danger">
                    Stop
                </button>

                <button id="restartButton" class="warning">
                    Restart
                </button>

            </div>

        </section>

        <section class="console-section">

            <div class="console-header">
                <h2>Console do servidor</h2>

                <button id="clearConsole">
                    Limpar console
                </button>
            </div>

            <div id="consoleOutput" class="console-output">
                <p class="system-log">
                    Aguardando conexão com o servidor...
                </p>
            </div>

            <form id="commandForm" class="command-form">

                <span>></span>

                <input
                    type="text"
                    id="commandInput"
                    placeholder="Digite um comando..."
                    autocomplete="off"
                >

                <button type="submit">
                    Enviar
                </button>

            </form>

        </section>

    </main>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/websocket.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
